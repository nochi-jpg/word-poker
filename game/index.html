<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことばポーカー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
 <div id="gl"></div><div id="vig"></div>
 <img id="bg2d" alt=""><img id="chara2d" alt="">

 <!-- タイトル -->
 <section id="scr-title" class="scr dots">
  <div class="band" style="top:470px"></div>
  <img id="logo" alt="ことばポーカー" data-box>
  <div id="menu">
   <button class="pbtn" data-box data-act="play">プレイ</button>
   <button class="pbtn" data-box data-act="howto">あそびかた</button>
   <button class="pbtn" data-box data-act="story">おはなし</button>
   <button class="pbtn" data-box data-act="best">ハイスコア</button>
   <button class="pbtn" data-box data-act="opt">オプション</button>
  </div>
  <div id="sign" data-box>作：K.nom</div>
 </section>

 <!-- 学年選択 -->
 <section id="scr-grade" class="scr dots">
  <div class="band" style="top:96px;height:90px"></div>
  <div id="gTitle" class="htitle" data-box>学年を えらぶ</div>
  <div id="gList"></div>
  <button class="pbtn sm" id="gBack" data-box>もどる</button>
 </section>

 <!-- 対戦 -->
 <section id="battle" class="scr">
  <div class="hud" id="hDealer" data-box>ディーラー 1 / 4</div>
  <div class="hud white" id="hStars" data-box></div>
  <div class="hud white" id="hSwap" data-box><span>入れかえ のこり</span><b id="swapN">8</b></div>
  <button class="hud btn" id="hPause" data-box>中断</button>
  <div id="sel">
   <div id="pv" data-box><span class="pvl">いまの文</span><span class="pvt fit" id="pvText"></span></div>
   <div id="pvScore" data-box></div>
   <div id="slots"></div>
   <div class="band dark" style="top:588px;left:-40px;width:1450px;height:240px;transform:rotate(-2deg)"></div>
   <div id="hand"></div>
   <button class="pbtn act" id="bSwap" data-box>入れかえ</button>
   <button class="pbtn act red" id="bGo" data-box>決定！</button>
   <div id="hint" data-box></div>
  </div>
 </section>

 <!-- ショップのカード選び -->
 <section id="shopPick" class="scr">
  <div id="spTitle" class="htitle" data-box>カードを えらぶ（1〜4まい）</div>
  <div id="spCards"></div>
  <div id="spInfo" data-box></div>
  <button class="pbtn red" id="spOk" data-box>これにする</button>
 </section>

 <!-- クリア -->
 <section id="result" class="scr dots">
  <div class="band" style="top:60px;height:110px"></div>
  <div id="rTitle" class="htitle big" data-box>クリア！</div>
  <div id="rRows"></div>
  <div id="rRank" data-box></div>
  <div id="rNote" data-box></div>
  <button class="pbtn red" id="rOk" data-box>タイトルへ</button>
 </section>

 <div id="cutin"><div class="ci-band2"></div><div class="ci-band"></div><img id="ciImg" alt=""><div id="ciText"><div id="ciRole"></div><div id="ciName"></div></div></div>
 <div id="stamp"></div>

 <!-- 文字ウインドウ（逆転裁判風） -->
 <div id="msg">
  <div id="mName"></div>
  <div id="mBody"><div id="mText"></div><div id="mChoices"></div><div id="mNext"></div></div>
 </div>
 <button class="hud btn" id="skipBtn">スキップ</button>

 <!-- ポップアップ（ボタンでページ切り替え） -->
 <div id="pop"><div id="popBox">
  <div id="popTitle" data-box></div>
  <div id="popBody" data-box></div>
  <div id="popFoot"></div>
 </div></div>
 <div id="loading">よみこみ中</div>
</div>

<script src="vendor/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/save.js"></script>
<script src="js/stage3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/story.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
